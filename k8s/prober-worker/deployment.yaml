apiVersion: apps/v1
kind: Deployment
metadata:
  name: prober-worker
  namespace: pulsepoint
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prober-worker
  template:
    metadata:
      labels:
        app: prober-worker
    spec:
      containers:
        - name: prober-worker
          image: pulsepoint/prober-worker:local
          envFrom:
            - secretRef:
                name: prober-secret
            - configMapRef:
                name: prober-config
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          # Worker has no HTTP endpoint; run as a long-lived process
      # Note: scaling this deployment >1 will cause duplicate checks until a coordination mechanism exists
