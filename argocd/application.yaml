apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pulsepoint
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/aishwarya011k/pulsepoint-manifests.git
    targetRevision: main
    path: dev
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: pulsepoint
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
