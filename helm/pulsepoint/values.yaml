namespace: pulsepoint

postgres:
  image: postgres:15
  database: pulsepoint
  user: pulse_user
  password: aishu  # Note: In production, override via --set or a separate secrets file; do not commit plaintext passwords
  storage: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

backendApi:
  image:
    repository: pulsepoint/backend-api
    tag: local
  replicas: 2
  port: 8000
  metricsPort: 8000
  host: "0.0.0.0"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  corsAllowedOrigins:
    - http://localhost:3000
    - http://localhost:30080
  secrets:
    jwtSecret: h3lf5UcDTKJUOcyrrEslPi9ZSHOgw7l6bsCA2SkSCoa
    internalApiToken: 3894c24bcc81591472a3a2878b80682c2cc35a44aa55d2fd59258c7a93bfd775

proberWorker:
  image:
    repository: pulsepoint/prober-worker
    tag: local
  replicas: 1
  metricsPort: 9000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi
  config:
    checkIntervalSeconds: "60"
    httpTimeoutSeconds: "10"

checksConsumer:
  image:
    repository: pulsepoint/checks-consumer
    tag: local
  replicas: 1
  metricsPort: 9001
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

aiEngine:
  image:
    repository: pulsepoint/ai-engine
    tag: local
  replicas: 1
  metricsPort: 9002
  consumerGroup: pulsepoint-ai-engine
  lokiUrl: http://loki.monitoring.svc.cluster.local:3100
  dashboardUrl: http://localhost:30080
  anomalyCooldownSeconds: 900
  latencyZscore: 2.0
  failureRateThreshold: 0.3
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 192Mi
  secrets:
    anthropicApiKey: ""

chatopsBot:
  image:
    repository: pulsepoint/chatops-bot
    tag: local
  replicas: 1
  metricsPort: 9003
  consumerGroup: pulsepoint-chatops
  dashboardUrl: http://localhost:30080
  resources:
    requests:
      cpu: 25m
      memory: 48Mi
    limits:
      cpu: 150m
      memory: 128Mi
  secrets:
    slackWebhookUrl: ""

kafka:
  enabled: true
  clusterName: pulsepoint-kafka
  bootstrapServers: pulsepoint-kafka-kafka-bootstrap:9092
  consumerGroup: pulsepoint-checks-consumer
  autoOffsetReset: earliest
  topics:
    checks: checks
    metrics: metrics
    incidents: incidents
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  zookeeper:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 300m
        memory: 512Mi

redis:
  enabled: true
  image: redis
  tag: "7-alpine"
  host: redis
  port: 6379
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

monitoring:
  enabled: true
  namespace: monitoring
  scrapeInterval: 30s

frontend:
  image:
    repository: pulsepoint/frontend
    tag: local
  replicas: 2
  port: 80
  nodePort: 30080
  apiBaseUrl: http://localhost:8000
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
