apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-engine-config
  namespace: {{ .Values.namespace }}
data:
  KAFKA_BOOTSTRAP_SERVERS: {{ .Values.kafka.bootstrapServers | quote }}
  KAFKA_CHECKS_TOPIC: {{ .Values.kafka.topics.checks | quote }}
  KAFKA_INCIDENTS_TOPIC: {{ .Values.kafka.topics.incidents | quote }}
  KAFKA_CONSUMER_GROUP: {{ .Values.aiEngine.consumerGroup | quote }}
  KAFKA_AUTO_OFFSET_RESET: {{ .Values.kafka.autoOffsetReset | quote }}
  REDIS_URL: {{ printf "redis://%s:%d" .Values.redis.host (int .Values.redis.port) | quote }}
  DATABASE_URL: {{ printf "postgresql://%s:%s@postgres:5432/%s" .Values.postgres.user .Values.postgres.password .Values.postgres.database | quote }}
  LOKI_URL: {{ .Values.aiEngine.lokiUrl | quote }}
  DASHBOARD_URL: {{ .Values.aiEngine.dashboardUrl | quote }}
  ANOMALY_COOLDOWN_SECONDS: {{ .Values.aiEngine.anomalyCooldownSeconds | quote }}
  LATENCY_ZSCORE: {{ .Values.aiEngine.latencyZscore | quote }}
  FAILURE_RATE_THRESHOLD: {{ .Values.aiEngine.failureRateThreshold | quote }}
