name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  packages: write
  contents: read

jobs:
  backend-lint:
    name: Backend - Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend-api/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run ruff linting
        run: ruff check backend-api/

  backend-test:
    name: Backend - Test
    runs-on: ubuntu-latest
    needs: backend-lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend-api/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend-api/requirements.txt

      - name: Run pytest
        run: python -m pytest backend-api/test_main.py -v
        env:
          DATABASE_URL: sqlite:///test.db
          JWT_SECRET: test-secret
          INTERNAL_API_TOKEN: test-token

  prober-lint:
    name: Prober Worker - Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'prober-worker/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run ruff linting
        run: ruff check prober-worker/

  prober-test:
    name: Prober Worker - Test
    runs-on: ubuntu-latest
    needs: prober-lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'prober-worker/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r prober-worker/requirements.txt

      - name: Placeholder test
        run: |
          echo "Prober Worker tests would run here"
          echo "Currently no test file exists for prober-worker; add tests/test_worker.py when ready"

  frontend-lint:
    name: Frontend - Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: cd frontend && npm ci --legacy-peer-deps

      - name: Run ESLint
        run: |
          # Run frontend lint only if a "lint" script is defined in package.json
          if node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('frontend/package.json','utf8')); process.exit(p.scripts && p.scripts.lint ? 0 : 1)"; then
            cd frontend && npm run lint
          else
            echo "No lint script defined; skipping ESLint."
          fi
        continue-on-error: true

  frontend-test:
    name: Frontend - Test
    runs-on: ubuntu-latest
    needs: frontend-lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: cd frontend && npm ci --legacy-peer-deps

      - name: Placeholder test
        run: |
          echo "Frontend tests would run here with: npm test"
          echo "Currently no test file exists for frontend; add tests when ready"

  build-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [backend-test, prober-test, frontend-test]
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        service: [backend-api, prober-worker, frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize repository owner to lowercase
        run: echo "IMAGE_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Determine image tag
        id: image_tag
        run: |
          IMAGE_NAME="ghcr.io/${IMAGE_OWNER}/pulsepoint-${{ matrix.service }}"
          GIT_SHA=${{ github.sha }}
          SHORT_SHA=${GIT_SHA:0:7}

          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            TAGS="${IMAGE_NAME}:${SHORT_SHA},${IMAGE_NAME}:latest"
          else
            TAGS="${IMAGE_NAME}:${SHORT_SHA}"
          fi

          echo "image_name=${IMAGE_NAME}" >> $GITHUB_OUTPUT
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Build Docker image for ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: false
          load: true
          tags: ${{ steps.image_tag.outputs.image_name }}:${{ steps.image_tag.outputs.short_sha }}
          build-args: |
            VITE_API_BASE_URL=http://localhost:8000

      - name: Run Trivy vulnerability scan for ${{ matrix.service }}
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.image_tag.outputs.image_name }}:${{ steps.image_tag.outputs.short_sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'MEDIUM,HIGH,CRITICAL'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Check Trivy scan for HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.image_tag.outputs.image_name }}:${{ steps.image_tag.outputs.short_sha }}
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
        # Intentionally fail the job when HIGH/CRITICAL vulnerabilities are found

      - name: Push image to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.image_tag.outputs.tags }}
          build-args: |
            VITE_API_BASE_URL=http://localhost:8000

  scan-results:
    name: Trivy Scan Complete
    runs-on: ubuntu-latest
    needs: build-push
    if: always()
    steps:
      - name: Check scan status
        run: |
          if [ "${{ needs.build-push.result }}" == "failure" ]; then
            echo "❌ Build or scan failed. Check Trivy results for details."
            exit 1
          fi
          echo "✅ All images built and scanned successfully"
