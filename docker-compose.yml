services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: pulsepoint
      POSTGRES_USER: pulse_user
      POSTGRES_PASSWORD: aishu
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pulsepoint

  backend-api:
    build:
      context: .
      dockerfile: backend-api/Dockerfile
    env_file:
      - backend-api/.env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pulsepoint

  prober-worker:
    build:
      context: .
      dockerfile: prober-worker/Dockerfile
    env_file:
      - prober-worker/.env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pulsepoint

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    env_file:
      - frontend/.env
    ports:
      - "3000:80"
    depends_on:
      backend-api:
        condition: service_healthy
    networks:
      - pulsepoint

volumes:
  pgdata:

networks:
  pulsepoint:
    driver: bridge